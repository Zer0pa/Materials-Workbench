[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zer0pa-materials-workbench"
version = "0.1.0"
description = "Zer0pa Materials Workbench — research infrastructure for in silico materials science discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — Zer0pa research artifact" }
authors = [{ name = "Zer0pa-Architect-Prime", email = "architects@zer0pa.ai" }]
keywords = ["materials", "DFT", "MLIP", "CALPHAD", "phase-field", "FEM", "battery", "thermoelectric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "rdflib>=7.0",
    "networkx>=3.2",
    "rich>=13.7",
    "structlog>=24.1",
    "typer>=0.12",
    "orjson>=3.10",
    "jsonschema>=4.21",
    "python-multipart>=0.0.9",
    "pint>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
]
materials-extras = [
    "pymatgen>=2024.5",
    "ase>=3.23",
    "phonopy>=2.21",
    "spglib>=2.4",
    "pycalphad>=0.11",
]
# GPU stack for the Runpod cutover. Keep deps to ones that pip-install on
# common GPU images. PySCF gets `[geomopt]` (CPU); GPU acceleration is via
# `gpu4pyscf` which has its own CUDA wheel matrix and is intentionally
# left to the operator at install time per docs/RUNPOD-CUTOVER.md.
gpu = [
    "torch>=2.4",
    "ase>=3.23",
    "pymatgen>=2024.5",
    "deepmd-kit>=3.0; python_version < '3.13'",
    "mace-torch>=0.3",
    "pennylane>=0.40",
    "pennylane-lightning>=0.40",
    "qiskit>=1.3",
    "qiskit-nature>=0.7",
    "pyscf>=2.7",
    "pycalphad>=0.11",
    "phonopy>=2.21",
    "spglib>=2.4",
    "psutil>=5.9",
]
runpod = [
    "httpx>=0.27",
    "tenacity>=8.5",
]

[project.scripts]
zer0pa-materials-workbench = "zer0pa_materials_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests across layers",
    "contract: contract conformance for adapters / REST stubs",
    "plug_swap: plug-replaceability invariant tests",
    "falsifier: falsification-wave negative tests",
    "parity: runpod_mock vs local_cpu schema parity",
    "slow: heavier tests; skip with -m 'not slow'",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
